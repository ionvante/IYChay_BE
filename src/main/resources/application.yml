spring:
  application:
    name: iychay-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iychay}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: "health,info"

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me}
      expiration-minutes: ${JWT_EXP_MINUTES:60}
  ia:
    base-url: ${IA_BASE_URL:http://localhost:8081}
    api-key: ${IA_API_KEY:}
  storage:
    bucket-url: ${STORAGE_BUCKET_URL:https://storage.local/iychay}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
